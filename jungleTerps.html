<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Terpene Viewer — Jungle Boys</title>
    <style>
        :root {
            --bg: #0b0e14;
            --panel: #141923;
            --panel2: #1b2230;
            --text: #f0f6fc;
            --muted: #8b949e;
            --accent: #2ea043;
            --border: #30363d;
            --blue: #00b4d8;
            --sale-red: #ff3366;
            --color-pink: #ff2a70;
            --color-cyan: #00b4d8;
            --color-lime: #8ac926;
            --gray-circle: #333b48;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Inter, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* =========================================================
           HEADER
        ========================================================= */
        .header-box {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-top h1 {
            font-size: 1.35rem;
            margin: 0 0 4px 0;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .reset-btn {
            background: var(--panel2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            border-color: var(--sale-red);
            color: var(--sale-red);
        }

        #status {
            color: var(--muted);
            font-size: 0.85rem;
        }

        /* =========================================================
           FILTERS
        ========================================================= */
        .filters-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-group.terpene-desc-group {
            flex: 1;
            min-width: 280px;
        }

        .filter-group label {
            font-size: 0.75rem;
            color: var(--muted);
            font-weight: 600;
        }

        .terpene-info-box {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--blue);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            line-height: 1.3;
            min-height: 35px;
            display: flex;
            align-items: center;
        }

        select,
        input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus,
        input:focus {
            border-color: var(--accent);
        }

        /* =========================================================
           PRODUCT GRID
        ========================================================= */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .product-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            min-height: 165px;
        }

        .product-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* =========================================================
           SELECTION CIRCLE
        ========================================================= */
        .card-selection-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
        }

        .select-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            background: var(--gray-circle);
            color: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-circle.pink {
            background: var(--color-pink);
            color: #fff;
        }

        .select-circle.cyan {
            background: var(--color-cyan);
            color: #000;
        }

        .select-circle.lime {
            background: var(--color-lime);
            color: #000;
        }

        /* =========================================================
           CARD
        ========================================================= */
        .card-top {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            padding-right: 40px;
        }

        .product-card img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background: #ffffff;
            border-radius: 8px;
            padding: 6px;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .card-info {
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 0.75rem;
            color: var(--muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .card-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            gap: 8px;
        }

        .card-price-area {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .card-price {
            color: var(--text);
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1;
        }

        .card-sale-badge {
            background: rgba(255, 51, 102, 0.15);
            color: var(--sale-red);
            border: 1px solid rgba(255, 51, 102, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-block;
            width: max-content;
            margin-top: 2px;
        }

        .card-offer-badge {
            background: rgba(255, 42, 112, 0.15);
            color: var(--color-pink);
            border: 1px solid rgba(255, 42, 112, 0.35);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-block;
            width: max-content;
            margin-top: 2px;
        }

        .card-terp-badge {
            background: rgba(46, 160, 67, 0.15);
            color: var(--accent);
            border: 1px solid rgba(46, 160, 67, 0.3);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            align-self: flex-end;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .card-terp-label-name {
            font-size: 0.7rem;
            color: var(--muted);
            font-weight: normal;
            text-transform: capitalize;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================================================
           HOVER PREVIEW
        ========================================================= */
        .hover-preview-tooltip {
            position: fixed;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            display: none;
            z-index: 2000;
            width: 240px;
            height: 240px;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .hover-preview-tooltip img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: #ffffff;
            border-radius: 8px;
            padding: 8px;
        }

        /* =========================================================
           MODAL
        ========================================================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .close-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            background: var(--panel2);
            border: 1px solid var(--border);
            color: var(--text);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .close-btn:hover {
            border-color: var(--accent);
        }

        .modal-header-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 30px;
            padding-bottom: 4px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .modal-sub {
            font-size: 0.85rem;
            color: var(--muted);
            background: var(--panel2);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: inline-block;
            margin-top: 4px;
        }

        .modal-special-banner {
            background: rgba(255, 51, 102, 0.12);
            border: 1px solid rgba(255, 51, 102, 0.3);
            color: var(--sale-red);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .image-container {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }

        .large-image-wrapper {
            width: 100%;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .large-image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: #ffffff;
        }

        /* =========================================================
           TERPENE LIST
        ========================================================= */
        .terpene-list-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
        }

        .terp-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 10px;
            gap: 10px;
        }

        .terp-name-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .terp-badge-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            background: rgba(0, 180, 216, 0.15);
            color: var(--blue);
            flex-shrink: 0;
        }

        .terp-metric-area {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.8rem;
        }

        .terp-pct {
            color: var(--text);
            font-weight: 700;
            background: var(--panel2);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        /* =========================================================
           SHOP BUTTON
        ========================================================= */
        .shop-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .shop-btn {
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            flex: 1;
        }

        .shop-btn:hover {
            opacity: 0.9;
        }

        /* =========================================================
           LOADING
        ========================================================= */
        .loading-box {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            padding: 50px 20px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           MOBILE
        ========================================================= */
        @media (max-width: 900px) {
            .filters-row {
                align-items: stretch;
            }

            .filter-group {
                flex: 1;
                min-width: 180px;
            }

            .filter-group.terpene-desc-group {
                min-width: 100%;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .header-box {
                padding: 16px;
            }

            .header-top {
                align-items: flex-start;
                gap: 12px;
            }

            .header-top h1 {
                font-size: 1.1rem;
            }

            .header-actions {
                flex-shrink: 0;
            }

            .reset-btn {
                padding: 7px 10px;
                font-size: 0.75rem;
            }

            .filter-group {
                min-width: 100%;
            }

            .grid-container {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 18px;
            }

            .large-image-wrapper {
                height: 180px;
            }
        }
    </style>
</head>

    </div>

        /* ================================================================
           VIBE SCORE
        ================================================================ */
        function getVibeScore(p, vibeName) {
            if (!vibeName || vibeName === "all") {
                return 0;
            }
            const targetTerpenes =
                vibeMappings[vibeName];
            if (
                !Array.isArray(targetTerpenes) ||
                targetTerpenes.length === 0
            ) {
                return 0;
            }
            let score = 0;
            let matchedTerpenes = 0;
            targetTerpenes.forEach(terpName => {
                const value =
                    getSpecificTerpeneVal(
                        p,
                        terpName
                    );
                if (value > 0) {
                    matchedTerpenes++;
                    score += value;
                }
            });
            if (matchedTerpenes > 1) {
                score +=
                    matchedTerpenes * 0.25;
            }
            return score;
        }

        /* ================================================================
   INITIALIZE
================================================================ */
        async function init() {
            const statusDiv =
                document.getElementById("status");
            try {
                /* ========================================================
                   PRODUCT REQUESTS
                ======================================================== */
                const productRequests =
                    categories.map(category => {
                        let url;
                        /*
                         * Flower and Pops use the subcategory endpoint.
                         * The other categories use categories[].
                         */
                        if (
                            category === "premium-flower" ||
                            category === "pops"
                        ) {
                            url =
                                `${API_BASE}/products?` +
                                `page=1` +
                                `&perpage=150` +
                                `&orderby=popular` +
                                `&order=desc` +
                                `&retailer=${encodeURIComponent(retailer)}` +
                                `&menutype=medical` +
                                `&subcategory=${encodeURIComponent(category)}`;
                        } else {
                            url =
                                `${API_BASE}/products?` +
                                `page=1` +
                                `&perpage=150` +
                                `&orderby=popular` +
                                `&order=desc` +
                                `&retailer=${encodeURIComponent(retailer)}` +
                                `&menutype=medical` +
                                `&categories[]=${encodeURIComponent(category)}`;
                        }
                        return {
                            category,
                            url
                        };
                    });
                /* ========================================================
                   SPECIALS REQUEST
                ======================================================== */
                const specialsRequest =
                    fetch(
                        `${API_BASE}/specials?` +
                        `retailer=${encodeURIComponent(retailer)}` +
                        `&menutype=medical`
                    )
                        .then(response =>
                            response.ok
                                ? response.json()
                                : null
                        )
                        .catch(() => null);
                /* ========================================================
                   LOAD PRODUCTS + SPECIALS
                ======================================================== */
                const productResponses =
                    await Promise.all(
                        productRequests.map(async request => {
                            try {
                                const response =
                                    await fetch(request.url);
                                if (!response.ok) {
                                    throw new Error(
                                        `HTTP ${response.status}`
                                    );
                                }
                                const data =
                                    await response.json();
                                return {
                                    category:
                                        request.category,
                                    data
                                };
                            } catch (error) {
                                console.error(
                                    `Failed loading ${request.category}:`,
                                    error
                                );
                                return {
                                    category:
                                        request.category,
                                    data: null
                                };
                            }
                        })
                    );
                const specialsData =
                    await specialsRequest;
                /* ========================================================
                   SPECIALS
                ======================================================== */
                loadedSpecials = [];
                if (specialsData) {
                    if (
                        Array.isArray(
                            specialsData
                        )
                    ) {
                        loadedSpecials =
                            specialsData;
                    } else if (
                        Array.isArray(
                            specialsData.specials
                        )
                    ) {
                        loadedSpecials =
                            specialsData.specials;
                    }
                }
                console.log(
                    "Jungle Boys: specials loaded",
                    loadedSpecials
                );
                /* ========================================================
                   PRODUCTS
                ======================================================== */
                loadedProducts = [];
                productResponses.forEach(result => {
                    let results = [];
                    if (
                        result.data &&
                        Array.isArray(
                            result.data.results
                        )
                    ) {
                        results =
                            result.data.results;
                    } else if (
                        result.data &&
                        Array.isArray(
                            result.data.products
                        )
                    ) {
                        results =
                            result.data.products;
                    } else if (
                        result.data &&
                        Array.isArray(
                            result.data.data
                        )
                    ) {
                        results =
                            result.data.data;
                    } else if (
                        Array.isArray(
                            result.data
                        )
                    ) {
                        results =
                            result.data;
                    }
                    console.log(
                        `Jungle Boys: ${result.category} returned ${results.length} products`
                    );
                    results.forEach(product => {
                        /*
                         * Remember which category produced this item.
                         */
                        product._assignedCategory =
                            result.category;
                        /*
                         * Determine whether the product has
                         * an actual variant-level sale.
                         */
                        const hasVariantSale =
                            Array.isArray(product.variants) &&
                            product.variants.some(variant => {
                                const salePrice =
                                    parseFloat(
                                        variant.sale_price
                                    );
                                const regularPrice =
                                    parseFloat(
                                        variant.price ??
                                        variant.regular_price
                                    );
                                return (
                                    !isNaN(salePrice) &&
                                    !isNaN(regularPrice) &&
                                    salePrice < regularPrice
                                );
                            });
                        const hasProductSale =
                            !!(
                                product.sale ||
                                product.special ||
                                product.discount ||
                                hasVariantSale
                            );
                        const productOffers =
                            Array.isArray(product.specials)
                                ? product.specials.filter(special => {
                                    if (!special) {
                                        return false;
                                    }

                                    const type = String(
                                        special.type || ""
                                    )
                                        .trim()
                                        .toUpperCase();

                                    return type === "OFFER";
                                })
                                : [];

                        product._activeOffers = productOffers;

                        const saleSpecial =
                            loadedSpecials.find(special => {
                                if (!special) {
                                    return false;
                                }
                                const type =
                                    String(
                                        special.type || ""
                                    )
                                        .trim()
                                        .toUpperCase();
                                return type === "SALE";
                            });
                        /*
                         * Attach the first active special
                         * when applicable.
                         */
                        if (
                            hasProductSale
                        ) {
                            /*
                             * Product itself reports a sale.
                             *
                             * Use the Jungle Boys SALE special when available.
                             */
                            product._activeSpecial =
                                saleSpecial ||
                                loadedSpecials[0] ||
                                null;
                        } else if (
                            saleSpecial
                        ) {
                            /*
                             * Jungle Boys exposes the sale through the specials
                             * endpoint rather than directly on the product.
                             *
                             * Mark the product as having an active special.
                             */
                            product._activeSpecial =
                                saleSpecial;
                        } else {
                            product._activeSpecial =
                                null;
                        }
                        loadedProducts.push(
                            product
                        );
                    });
                });
                console.log(
                    "Jungle Boys: loadedProducts before dedupe",
                    loadedProducts
                );
                /* ========================================================
                   REMOVE DUPLICATES
                ======================================================== */
                const seenProducts =
                    new Set();
                loadedProducts =
                    loadedProducts.filter(product => {
                        const productId =
                            product.id ||
                            product._id ||
                            product.slug ||
                            product.name;
                        /*
                         * If there is no usable ID,
                         * keep the product.
                         */
                        if (!productId) {
                            return true;
                        }
                        if (
                            seenProducts.has(
                                productId
                            )
                        ) {
                            return false;
                        }
                        seenProducts.add(
                            productId
                        );
                        return true;
                    });
                console.log(
                    "Jungle Boys: loadedProducts after dedupe",
                    loadedProducts
                );
                /* ========================================================
                   STATUS
                ======================================================== */
                if (
                    loadedProducts.length === 0
                ) {
                    statusDiv.textContent =
                        `No products available for ${formattedRetailerName}.`;
                    return;
                }
                statusDiv.textContent =
                    `Loaded ${loadedProducts.length} items for ${formattedRetailerName}`;
                /* ========================================================
                   POPULATE FILTERS
                ======================================================== */
                populateDropdowns();
                /* ========================================================
                   INITIAL RENDER
                ======================================================== */
                applyFilters();
            } catch (error) {
                console.error(
                    "Inventory loading error:",
                    error
                );
                statusDiv.textContent =
                    `Failed to load inventory data for ${formattedRetailerName}.`;
            }
        }
        /* ========================================================

        /* ========================================================
           PRICE
        ======================================================== */
        function getProductPrice(product) {
            if (
                Array.isArray(product.variants) &&
                product.variants.length > 0
            ) {
                const prices =
                    product.variants
                        .map(variant => {
                            const salePrice =
                                parseFloat(
                                    variant.sale_price
                                );
                            const regularPrice =
                                parseFloat(
                                    variant.price ??
                                    variant.regular_price
                                );
                            if (
                                !isNaN(salePrice) &&
                                !isNaN(regularPrice) &&
                                salePrice < regularPrice
                            ) {
                                return salePrice;
                            }
                            if (
                                !isNaN(regularPrice)
                            ) {
                                return regularPrice;
                            }
                            return NaN;
                        })
                        .filter(
                            value =>
                                !isNaN(value)
                        );
                if (
                    prices.length > 0
                ) {
                    return Math.min(
                        ...prices
                    );
                }
            }
            return 9999;
        }
        /* ========================================================
           TOTAL TERPENES
        ======================================================== */
        function getTotalTerpene(product) {
            if (
                !Array.isArray(
                    product.terpenes
                ) ||
                product.terpenes.length === 0
            ) {
                return 0;
            }
            const totalEntry =
                product.terpenes.find(
                    terpene =>
                        terpene.name &&
                        terpene.name
                            .toLowerCase()
                            .includes("total")
                );
            if (
                totalEntry
            ) {
                const value =
                    totalEntry.value ??
                    totalEntry.percentage ??
                    totalEntry.amount ??
                    totalEntry.val;
                return typeof value === "number"
                    ? value
                    : parseFloat(value) || 0;
            }
            let total = 0;
            product.terpenes.forEach(
                terpene => {
                    if (
                        terpene.name &&
                        terpene.name
                            .toLowerCase()
                            .includes("total")
                    ) {
                        return;
                    }
                    const value =
                        terpene.value ??
                        terpene.percentage ??
                        terpene.amount ??
                        terpene.val;
                    total +=
                        typeof value === "number"
                            ? value
                            : parseFloat(value) || 0;
                }
            );
            return total;
        }
        /* ========================================================
           SPECIFIC TERPENE
        ======================================================== */
        function getSpecificTerpeneVal(
            product,
            terpeneName
        ) {
            if (
                !Array.isArray(
                    product.terpenes
                )
            ) {
                return 0;
            }
            const found =
                product.terpenes.find(
                    terpene =>
                        terpene.name &&
                        terpene.name
                            .trim()
                            .toLowerCase() ===
                        terpeneName
                            .trim()
                            .toLowerCase()
                );
            if (
                !found
            ) {
                return 0;
            }
            const value =
                found.value ??
                found.percentage ??
                found.amount ??
                found.val;
            return typeof value === "number"
                ? value
                : parseFloat(value) || 0;
        }
        /* ========================================================
           SUBCATEGORY MATCH
        ======================================================== */
        function matchesSubcategory(
            product,
            filterValue
        ) {
            if (
                filterValue === "all"
            ) {
                return true;
            }
            const value =
                product.subcategory ||
                product.sub_category ||
                product.subCategory ||
                "";
            return value
                .toString()
                .trim()
                .toLowerCase() ===
                filterValue
                    .toString()
                    .trim()
                    .toLowerCase();
        }
        /* ========================================================
           STRAIN MATCH
        ======================================================== */
        function matchesStrainType(
            product,
            filterValue
        ) {
            if (
                filterValue === "all"
            ) {
                return true;
            }
            const value =
                product.strain_type ||
                product.strainType ||
                product.species ||
                "";
            return value
                .toString()
                .trim()
                .toLowerCase() ===
                filterValue
                    .toString()
                    .trim()
                    .toLowerCase();
        }
        /* ========================================================
           VARIANT MATCH
        ======================================================== */
        function matchesVariantOption(
            product,
            filterValue
        ) {
            if (
                filterValue === "all"
            ) {
                return true;
            }
            if (
                !Array.isArray(
                    product.variants
                )
            ) {
                return false;
            }
            return product.variants.some(
                variant => {
                    const name =
                        variant.name ||
                        variant.option ||
                        variant.weight ||
                        variant.size ||
                        variant.title;
                    return (
                        name &&
                        name
                            .toString()
                            .trim()
                            .toLowerCase() ===
                        filterValue
                            .toString()
                            .trim()
                            .toLowerCase()
                    );
                }
            );
        }
        /* ========================================================
           SPECIAL MATCH
        ======================================================== */
        function matchesSpecialFilter(
            product,
            filterValue
        ) {
            if (
                filterValue === "all"
            ) {
                return true;
            }

            const hasSale =
                !!product._activeSpecial;

            const hasOffer =
                Array.isArray(product._activeOffers) &&
                product._activeOffers.length > 0;

            const hasSpecial =
                hasSale || hasOffer;

            if (
                filterValue === "on-sale"
            ) {
                return hasSpecial;
            }

            if (
                filterValue === "none"
            ) {
                return !hasSpecial;
            }

            return true;
        }

        /* ========================================================
           APPLY FILTERS
        ======================================================== */
        function applyFilters() {
            const categoryValue =
                document.getElementById(
                    "categoryFilter"
                ).value;
            const subcategoryValue =
                document.getElementById(
                    "subcatFilter"
                ).value;
            const strainValue =
                document.getElementById(
                    "strainFilter"
                ).value;
            const variantValue =
                document.getElementById(
                    "variantFilter"
                ).value;
            const specialValue =
                document.getElementById(
                    "specialFilter"
                ).value;
            const vibeValue =
                document.getElementById(
                    "vibeFilter"
                ).value;
            const terpeneValue =
                document.getElementById(
                    "terpeneFilter"
                ).value;
            const sortMode =
                document.getElementById(
                    "sortModeFilter"
                ).value;
            let filtered =
                loadedProducts.filter(
                    product => {
                        /* CATEGORY */
                        if (
                            categoryValue !== "all" &&
                            product._assignedCategory !==
                            categoryValue
                        ) {
                            return false;
                        }
                        /* SUBCATEGORY */
                        if (
                            !matchesSubcategory(
                                product,
                                subcategoryValue
                            )
                        ) {
                            return false;
                        }
                        /* STRAIN */
                        if (
                            !matchesStrainType(
                                product,
                                strainValue
                            )
                        ) {
                            return false;
                        }
                        /* VARIANT */
                        if (
                            !matchesVariantOption(
                                product,
                                variantValue
                            )
                        ) {
                            return false;
                        }
                        /* SPECIAL */
                        if (
                            !matchesSpecialFilter(
                                product,
                                specialValue
                            )
                        ) {
                            return false;
                        }
                        /* TERPENE */
                        if (
                            terpeneValue !== "all"
                        ) {
                            const value =
                                getSpecificTerpeneVal(
                                    product,
                                    terpeneValue
                                );
                            if (
                                value <= 0
                            ) {
                                return false;
                            }
                        }
                        /* VIBE */
                        if (
                            vibeValue !== "all"
                        ) {
                            const vibeScore =
                                getVibeScore(
                                    product,
                                    vibeValue
                                );
                            if (
                                vibeScore <= 0
                            ) {
                                return false;
                            }
                        }
                        return true;
                    }
                );
            /* ========================================================
               VIBE SORT
            ======================================================== */
            if (
                vibeValue !== "all"
            ) {
                filtered.sort(
                    (a, b) => {
                        const scoreA =
                            getVibeScore(
                                a,
                                vibeValue
                            );
                        const scoreB =
                            getVibeScore(
                                b,
                                vibeValue
                            );
                        if (
                            Math.abs(
                                scoreB - scoreA
                            ) > 0.0001
                        ) {
                            return (
                                scoreB - scoreA
                            );
                        }
                        const terpA =
                            getTotalTerpene(a);
                        const terpB =
                            getTotalTerpene(b);
                        if (
                            Math.abs(
                                terpB - terpA
                            ) > 0.0001
                        ) {
                            return (
                                terpB - terpA
                            );
                        }
                        return (
                            getProductPrice(a) -
                            getProductPrice(b)
                        );
                    }
                );
            }
            /* ========================================================
               VALUE SORT
            ======================================================== */
            else if (
                sortMode === "value-best"
            ) {
                filtered.sort(
                    (a, b) => {
                        const terpA =
                            getTotalTerpene(a);
                        const terpB =
                            getTotalTerpene(b);
                        if (
                            Math.abs(
                                terpB - terpA
                            ) > 0.0001
                        ) {
                            return (
                                terpB - terpA
                            );
                        }
                        return (
                            getProductPrice(a) -
                            getProductPrice(b)
                        );
                    }
                );
            }
            /* ========================================================
               TARGETED TERPENE SORT
            ======================================================== */
            else if (
                sortMode === "targeted-best"
            ) {
                filtered.sort(
                    (a, b) => {
                        const valueA =
                            terpeneValue !== "all"
                                ? getSpecificTerpeneVal(
                                    a,
                                    terpeneValue
                                )
                                : getTotalTerpene(a);
                        const valueB =
                            terpeneValue !== "all"
                                ? getSpecificTerpeneVal(
                                    b,
                                    terpeneValue
                                )
                                : getTotalTerpene(b);
                        if (
                            Math.abs(
                                valueB - valueA
                            ) > 0.0001
                        ) {
                            return (
                                valueB - valueA
                            );
                        }
                        return (
                            getProductPrice(a) -
                            getProductPrice(b)
                        );
                    }
                );
            }
            renderGrid(filtered);
        }
        /* ========================================================
           COLOR SELECTION
        ======================================================== */
        function handleSingleCircleClick(
            event,
            originalIndex
        ) {
            event.stopPropagation();
            const currentColor =
                userSelections[
                originalIndex
                ] || null;
            if (
                currentColor !== null
            ) {
                delete userSelections[
                    originalIndex
                ];
            } else {
                const usedColors =
                    new Set(
                        Object.values(
                            userSelections
                        )
                    );
                const availableColors =
                    allColors.filter(
                        color =>
                            !usedColors.has(color)
                    );
                if (
                    availableColors.length === 0
                ) {
                    alert(
                        "All selection colors (Pink, Cyan, Lime) are currently in use. Please deselect one first."
                    );
                    return;
                }
                userSelections[
                    originalIndex
                ] =
                    availableColors[0];
            }
            applyFilters();
        }
        /* ========================================================
           PRODUCT IMAGE
        ======================================================== */
        function getProductImage(product) {
            return (
                product.images?.[0]?.url ||
                product.images?.[0]?.src ||
                product.image ||
                product.image_url ||
                product.thumbnail ||
                ""
            );
        }
        /* ========================================================
           RENDER GRID
        ======================================================== */
        function renderGrid(products) {
            const container =
                document.getElementById(
                    "productGrid"
                );
            const sortMode =
                document.getElementById(
                    "sortModeFilter"
                ).value;
            const terpeneValue =
                document.getElementById(
                    "terpeneFilter"
                ).value;
            if (
                products.length === 0
            ) {
                container.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                color:var(--muted);
                padding:40px;
            ">
                No matching products found.
            </div>
        `;
                return;
            }
            container.innerHTML =
                products.map(product => {
                    const originalIndex =
                        loadedProducts.indexOf(
                            product
                        );
                    const rawPrice =
                        getProductPrice(
                            product
                        );
                    const priceValue =
                        rawPrice !== 9999
                            ? `$${rawPrice.toFixed(2)}`
                            : "—";
                    const totalTerpene =
                        getTotalTerpene(
                            product
                        );
                    let badgeValue =
                        totalTerpene;
                    let labelDisplay =
                        "";
                    if (
                        sortMode ===
                        "targeted-best" &&
                        terpeneValue !== "all"
                    ) {
                        badgeValue =
                            getSpecificTerpeneVal(
                                product,
                                terpeneValue
                            );
                        labelDisplay = `
                    <span class="card-terp-label-name">
                        ${terpeneValue}
                    </span>
                `;
                    }
                    const imageUrl =
                        getProductImage(
                            product
                        );
                    const description =
                        product.description
                            ? product.description
                                .replace(
                                    /<[^>]*>/g,
                                    ""
                                )
                            : "Jungle Boys Florida medical product profile.";
                    const activeSpecial =
                        product._activeSpecial;
                    const activeOffers =
                        Array.isArray(product._activeOffers)
                            ? product._activeOffers
                            : [];

                    const selectedColor =
                        userSelections[
                        originalIndex
                        ];
                    const colorClass =
                        selectedColor ||
                        "";
                    return `
                <div
                    class="product-card"
                    onclick="openProductModal(${originalIndex})"
                    onmouseenter="showHoverPreview(event, '${imageUrl}')"
                    onmousemove="moveHoverPreview(event)"
                    onmouseleave="hideHoverPreview()"
                >
                    <div class="card-selection-badge">
                        <button
                            class="select-circle ${colorClass}"
                            title="Click to select or deselect color"
                            onclick="handleSingleCircleClick(
                                event,
                                ${originalIndex}
                            )"
                        >
                            ✓
                        </button>
                    </div>
                    <div class="card-top">
                        ${imageUrl
                            ? `
                                    <img
                                        src="${imageUrl}"
                                        alt=""
                                    >
                                `
                            : `
                                    <div style="
                                        width:60px;
                                        height:60px;
                                        background:#ffffff;
                                        border-radius:8px;
                                    "></div>
                                `
                        }
                        <div class="card-info">
                            <div class="card-title">
                                ${product.name ||
                        product.title ||
                        "Unnamed Product"
                        }
                            </div>
                            <div class="card-desc">
                                ${description}
                            </div>
                        </div>
                    </div>
                    <div class="card-footer-row">
                        <div class="card-price-area">
                            <span class="card-price">
                                ${priceValue}
                            </span>
                            ${activeSpecial
                            ? `
                                    <span class="card-sale-badge">
                                        ${activeSpecial.type || "SALE"}
                                    </span>
                                `
                            : ""
                        }

                        ${activeOffers.length > 0
                            ? activeOffers.map(offer => `
                                <span class="card-offer-badge">
                                    ${offer.name || "SPECIAL OFFER"}
                                </span>
                            `).join("")
                            : ""
                        }

                        </div>
                        <span class="card-terp-badge">
                            ${labelDisplay}
                            <span>
                                ${badgeValue.toFixed(2)}%
                            </span>
                        </span>
                    </div>
                </div>
            `;
                }).join("");
        }
        /* ========================================================
           HOVER IMAGE PREVIEW
        ======================================================== */
        function showHoverPreview(
            event,
            imageUrl
        ) {
            if (
                !imageUrl
            ) {
                return;
            }
            const tooltip =
                document.getElementById(
                    "hoverPreview"
                );
            const image =
                document.getElementById(
                    "hoverPreviewImg"
                );
            image.src =
                imageUrl;
            tooltip.style.display =
                "flex";
            updateTooltipPosition(
                event
            );
        }
        function moveHoverPreview(
            event
        ) {
            updateTooltipPosition(
                event
            );
        }
        function updateTooltipPosition(
            event
        ) {
            const tooltip =
                document.getElementById(
                    "hoverPreview"
                );
            const offset =
                20;
            let x =
                event.clientX +
                offset;
            let y =
                event.clientY +
                offset;
            if (
                x + 240 >
                window.innerWidth
            ) {
                x =
                    event.clientX -
                    240 -
                    offset;
            }
            if (
                y + 240 >
                window.innerHeight
            ) {
                y =
                    event.clientY -
                    240 -
                    offset;
            }
            tooltip.style.left =
                `${x}px`;
            tooltip.style.top =
                `${y}px`;
        }
        function hideHoverPreview() {
            document.getElementById(
                "hoverPreview"
            ).style.display =
                "none";
        }
        /* ========================================================
           PRODUCT MODAL
        ======================================================== */
        function openProductModal(
            originalIndex
        ) {
            const product =
                loadedProducts[
                originalIndex
                ];
            if (
                !product
            ) {
                console.error(
                    "Product not found:",
                    originalIndex
                );
                return;
            }
            const modalOverlay =
                document.getElementById(
                    "modalOverlay"
                );
            const modalBody =
                document.getElementById(
                    "modalBody"
                );
            const title =
                product.name ||
                product.title ||
                "Unnamed Product";
            const description =
                product.description ||
                product.short_description ||
                "No description available.";
            const imageUrl =
                getProductImage(
                    product
                );
            const strainType =
                product.strain_type ||
                product.strainType ||
                product.species ||
                "Hybrid";
            const subcategory =
                product.subcategory ||
                product.sub_category ||
                product.subCategory ||
                "";
            const price =
                getProductPrice(
                    product
                );
            const priceDisplay =
                price !== 9999
                    ? `$${price.toFixed(2)}`
                    : "—";
            const totalTerpene =
                getTotalTerpene(
                    product
                );
            /* ========================================================
               SHOP URL
            ======================================================== */
            let shopUrl =
                product.permalink ||
                product.url ||
                product.link ||
                product.product_url;
            if (
                !shopUrl ||
                typeof shopUrl !== "string" ||
                !shopUrl.includes("http")
            ) {
                const slug =
                    product.slug ||
                    title
                        .toLowerCase()
                        .replace(
                            /[^a-z0-9]+/g,
                            "-"
                        )
                        .replace(
                            /^-|-$/g,
                            ""
                        );
                shopUrl =
                    `https://jungleboysflorida.com/${retailer}/shop/${slug}/`;
            }
            /* ========================================================
               TERPENE ROWS
            ======================================================== */
            let terpRowsHtml = `
        <div class="terp-row">
            <div class="terp-name-area">
                <div class="terp-badge-icon">
                    🌿
                </div>
                <span>
                    Total Terpenes
                </span>
            </div>
            <div class="terp-metric-area">
                <span class="terp-pct">
                    ${totalTerpene.toFixed(2)}%
                </span>
            </div>
        </div>
    `;
            if (
                Array.isArray(
                    product.terpenes
                ) &&
                product.terpenes.length > 0
            ) {
                product.terpenes.forEach(
                    terpene => {
                        if (
                            terpene.name &&
                            terpene.name
                                .toLowerCase()
                                .includes("total")
                        ) {
                            return;
                        }
                        const name =
                            terpene.name ||
                            "Compound";
                        const rawValue =
                            terpene.value ??
                            terpene.percentage ??
                            terpene.amount ??
                            terpene.val ??
                            0;
                        const numericValue =
                            typeof rawValue === "number"
                                ? rawValue
                                : parseFloat(
                                    rawValue
                                ) || 0;
                        const percentage =
                            numericValue > 10
                                ? numericValue / 100
                                : numericValue;
                        terpRowsHtml += `
                    <div class="terp-row">
                        <div class="terp-name-area">
                            <div class="terp-badge-icon">
                                🌿
                            </div>
                            <span>
                                ${name}
                            </span>
                        </div>
                        <div class="terp-metric-area">
                            <span class="terp-pct">
                                ${percentage.toFixed(2)}%
                            </span>
                        </div>
                    </div>
                `;
                    }
                );
            } else {
                terpRowsHtml += `
            <div style="
                color:var(--muted);
                font-size:0.85rem;
                text-align:center;
                padding:12px;
            ">
                No individual terpene breakdown listed for this item.
            </div>
        `;
            }
            /* ========================================================
               MODAL CONTENT
            ======================================================== */
            modalBody.innerHTML = `
        <div class="modal-header-info">
            <div class="modal-title">
                ${title}
            </div>
            <div>
                <span class="modal-sub">
                    ${strainType}
                    ${subcategory
                    ? ` • ${subcategory}`
                    : ""
                }
                    • Total Terpenes:
                    ${totalTerpene.toFixed(2)}%
                    ${price !== 9999
                    ? ` • ${priceDisplay}`
                    : ""
                }
                </span>
            </div>
        </div>
        ${product._activeSpecial || 
    (Array.isArray(product._activeOffers) &&
     product._activeOffers.length > 0)
    ? `
        <div class="modal-special-banner">
            <span>🔥</span>
            <span>
                ${
                    product._activeSpecial?.name ||
                    product._activeOffers
                                    .map(offer => offer.name)
                                    .join(" • ") ||
                                "Special Offer Active"
                            }
                        </span>
                    </div>
                `
                : ""
                }

        <div class="image-container">
            <div class="large-image-wrapper">
                <img
                    src="${imageUrl}"
                    alt="${title}"
                >
            </div>
        </div>
        <div style="
            font-size:0.85rem;
            color:var(--muted);
            line-height:1.4;
        ">
            ${description}
        </div>
        <div class="terpene-list-box">
            ${terpRowsHtml}
        </div>
        <div class="shop-row">
            <a
                class="shop-btn"
                href="${shopUrl}"
                target="_blank"
                rel="noopener noreferrer"
            >
                View Lab Report &amp; Shop
            </a>
        </div>
    `;
            modalOverlay.classList.add(
                "active"
            );
        }
        /* ========================================================
           CLOSE MODAL
        ======================================================== */
        function closeModal() {
            document
                .getElementById(
                    "modalOverlay"
                )
                .classList.remove(
                    "active"
                );
        }
        function handleModalClick(
            event
        ) {
            if (
                event.target.id ===
                "modalOverlay"
            ) {
                closeModal();
            }
        }
        /* ========================================================
           START
        ======================================================== */
        init();
    </script>
</body>

</html>
