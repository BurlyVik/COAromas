<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Terpene Viewer — Cookies Florida</title>
    <style>
        :root {
            --bg: #0b0e14;
            --panel: #141923;
            --panel2: #1b2230;
            --text: #f0f6fc;
            --muted: #8b949e;
            --accent: #2ea043;
            --border: #30363d;
            --blue: #00b4d8;
            --sale-red: #ff3366;
            --color-pink: #ff2a70;
            --color-cyan: #00b4d8;
            --color-lime: #8ac926;
            --gray-circle: #333b48;
        }
        * { box-sizing: border-box; }
        body {
            font-family: Inter, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
        }
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header-box {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-top h1 {
            font-size: 1.35rem;
            margin: 0 0 4px 0;
            font-weight: 700;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .reset-btn {
            background: var(--panel2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reset-btn:hover {
            border-color: var(--sale-red);
            color: var(--sale-red);
        }
        #status {
            color: var(--muted);
            font-size: 0.85rem;
        }
        .filters-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .filter-group.terpene-desc-group {
            flex: 1;
            min-width: 280px;
        }
        .filter-group label {
            font-size: 0.75rem;
            color: var(--muted);
            font-weight: 600;
        }
        .terpene-info-box {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--blue);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            line-height: 1.3;
            min-height: 35px;
            display: flex;
            align-items: center;
        }
        select, input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, input:focus {
            border-color: var(--accent);
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .product-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .product-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        
        .card-selection-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
        }
        .select-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            background: var(--gray-circle);
            color: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .select-circle.pink { background: var(--color-pink); color: #fff; }
        .select-circle.cyan { background: var(--color-cyan); color: #000; }
        .select-circle.lime { background: var(--color-lime); color: #000; }

        .card-top {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            padding-right: 40px;
        }
        .product-card img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background: #ffffff;
            border-radius: 8px;
            padding: 6px;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .card-info {
            flex: 1;
            min-width: 0;
        }
        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
            margin-bottom: 4px;
        }
        .card-desc {
            font-size: 0.75rem;
            color: var(--muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        .card-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .card-price-area {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .card-price {
            color: var(--text);
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1;
        }
        .card-sale-badge {
            background: rgba(255, 51, 102, 0.15);
            color: var(--sale-red);
            border: 1px solid rgba(255, 51, 102, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-block;
            width: max-content;
            margin-top: 2px;
        }
        .card-terp-badge {
            background: rgba(46, 160, 67, 0.15);
            color: var(--accent);
            border: 1px solid rgba(46, 160, 67, 0.3);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            align-self: flex-end;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-terp-label-name {
            font-size: 0.7rem;
            color: var(--muted);
            font-weight: normal;
            text-transform: capitalize;
        }

        .hover-preview-tooltip {
            position: fixed;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 16px 32px rgba(0,0,0,0.6);
            pointer-events: none;
            display: none;
            z-index: 2000;
            width: 240px;
            height: 240px;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .hover-preview-tooltip img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: #ffffff;
            border-radius: 8px;
            padding: 8px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .close-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            background: var(--panel2);
            border: 1px solid var(--border);
            color: var(--text);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn:hover {
            border-color: var(--accent);
        }
        .modal-header-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 30px;
            padding-bottom: 4px;
        }
        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .modal-sub {
            font-size: 0.85rem;
            color: var(--muted);
            background: var(--panel2);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: inline-block;
            margin-top: 4px;
        }
        .modal-special-banner {
            background: rgba(255, 51, 102, 0.12);
            border: 1px solid rgba(255, 51, 102, 0.3);
            color: var(--sale-red);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .image-container {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }
        .large-image-wrapper {
            width: 100%;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .large-image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: #ffffff;
        }
        .terpene-list-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .terp-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 10px;
        }
        .terp-name-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .terp-badge-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            background: rgba(0, 180, 216, 0.15);
            color: var(--blue);
        }
        .terp-metric-area {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.8rem;
        }
        .terp-mg {
            color: var(--muted);
        }
        .terp-pct {
            color: var(--text);
            font-weight: 700;
            background: var(--panel2);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .shop-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }
        .shop-btn {
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            flex: 1;
        }
        .shop-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header-box">
            <div class="header-top">
                <div>
                    <h1 id="pageTitle">Cookies Florida Inventory</h1>
                    <div id="status">Loading items...</div>
                </div>
                <div class="header-actions">
                    <button class="reset-btn" onclick="resetAllFilters()">Reset Filters</button>
                </div>
            </div>
            <div class="filters-row">
                <div class="filter-group">
                    <label>Product Type</label>
                    <select id="categoryFilter" onchange="applyFilters()">
                        <option value="all">All Categories</option>
                        <option value="premium-flower">Flower</option>
                        <option value="vapes">Vapes</option>
                        <option value="concentrates">Concentrates</option>
                        <option value="pre-rolls">Pre-Rolls</option>
                        <option value="edibles">Edibles</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Delivery Type (Subcategory)</label>
                    <select id="subcatFilter" onchange="applyFilters()">
                        <option value="all">All Subcategories</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Strain Type</label>
                    <select id="strainFilter" onchange="applyFilters()">
                        <option value="all">All Strain Types</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Variant Option / Size</label>
                    <select id="variantFilter" onchange="applyFilters()">
                        <option value="all">All Sizes / Weights</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Specials / Deals</label>
                    <select id="specialFilter" onchange="applyFilters()">
                        <option value="all">All Items (Specials & Regular)</option>
                        <option value="on-sale">On Sale Only</option>
                        <option value="none">Regular Price Only</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Special Sort Mode</label>
                    <select id="sortModeFilter" onchange="applyFilters()">
                        <option value="default">Standard Sort</option>
                        <option value="value-best">Highest Terpene + Lowest Price</option>
                        <option value="targeted-best">Selected Terpene + Lowest Price</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Vibe / Gravity Effect</label>
                    <select id="vibeFilter" onchange="applyFilters()">
                        <option value="all">All Vibes & Gravity Effects</option>
                        <option value="couch-lock">Couch Lock (Heavy Body)</option>
                        <option value="hypogravity">Hypogravity (Floating / Dreamy)</option>
                        <option value="hypergravity">Hypergravity (Grounded & Rooted)</option>
                        <option value="deep-sleep">Deep Sleep & Relaxation</option>
                        <option value="pain-relief">Pain Relief</option>
                        <option value="energetic">Energetic & Uplifted</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Specific Terpene</label>
                    <select id="terpeneFilter" onchange="onTerpeneChange()">
                        <option value="all">All Terpenes</option>
                    </select>
                </div>
                <div class="filter-group terpene-desc-group">
                    <label>Medicinal Profile & Use</label>
                    <div class="terpene-info-box" id="terpeneInfoDesc">Select a specific terpene to view its medicinal benefits and aromatic profile.</div>
                </div>
            </div>
        </div>
        <div class="grid-container" id="productGrid"></div>
    </div>

    <!-- HOVER PREVIEW TOOLTIP -->
    <div class="hover-preview-tooltip" id="hoverPreview">
        <img id="hoverPreviewImg" src="" alt="">
    </div>

    <!-- MODAL POPUP -->
    <div class="modal-overlay" id="modalOverlay" onclick="handleModalClick(event)">
        <div class="modal-content" id="modalContent">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const retailer = params.get("retailer") || "tampa";
        
        const formattedRetailerName = retailer.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        document.getElementById("pageTitle").textContent = `Cookies ${formattedRetailerName} Inventory`;

        const categories = ["vapes", "concentrates", "pre-rolls", "premium-flower", "edibles"];
        let loadedProducts = [];
        let loadedSpecials = [];

        const allColors = ["pink", "cyan", "lime"];
        let userSelections = {}; 

        const vibeMappings = {
            "couch-lock": ["beta myrcene", "beta caryophyllene", "linalool"],
            "hypogravity": ["terpinolene", "limonene", "ocimene"],
            "hypergravity": ["beta caryophyllene", "humulene", "bisabolol"],
            "deep-sleep": ["beta myrcene", "nerolidol", "linalool"],
            "pain-relief": ["beta caryophyllene", "guaiol", "caryophyllene oxide"],
            "energetic": ["alpha pinene", "beta pinene", "limonene"]
        };

        const terpeneDatabase = {
            "alpha pinene": "Aromatic profile: Sharp pine and rosemary. Medicinal uses: Enhances alertness, opens airways, and helps reduce inflammation and memory loss.",
            "beta caryophyllene": "Aromatic profile: Spicy, peppery, and woody. Medicinal uses: Uniquely binds to CB2 receptors to relieve chronic pain and reduce systemic inflammation.",
            "beta myrcene": "Aromatic profile: Earthy, musky, and herbal clove. Medicinal uses: Promotes deep physical relaxation and sedation while assisting with chronic pain relief.",
            "beta pinene": "Aromatic profile: Fresh pine and woodsy notes. Medicinal uses: Offers robust antibacterial properties, aids alertness, and acts as a bronchodilator.",
            "bisabolol": "Aromatic profile: Floral, sweet, and chamomile-like. Medicinal uses: Soothes skin irritation, provides anti-inflammatory support, and reduces stomach discomfort.",
            "camphene": "Aromatic profile: Pungent damp earth and fir needles. Medicinal uses: Lowers cholesterol levels, fights fungal infections, and acts as an antioxidant.",
            "caryophyllene oxide": "Aromatic profile: Woody and dry spice. Medicinal uses: Strong antifungal properties, protects cells from oxidative stress, and helps manage pain.",
            "eucalyptol": "Aromatic profile: Minty, fresh, and herbal eucalyptus. Medicinal uses: Relieves sinus congestion, suppresses coughs, and improves respiratory function.",
            "geraniol": "Aromatic profile: Rose-like, sweet, and fruity. Medicinal uses: Acts as a natural neuroprotectant, fights microbial threats, and helps repel insects.",
            "guaiol": "Aromatic profile: Pine, wood, and rose. Medicinal uses: Exhibits anti-inflammatory activity, serves as an antimicrobial agent, and helps ease cough symptoms.",
            "humulene": "Aromatic profile: Woody, earthy, and hoppy. Medicinal uses: Functions as an appetite suppressant and offers strong anti-inflammatory properties.",
            "isopulegol": "Aromatic profile: Minty and herbal. Medicinal uses: Provides calming effects on the nervous system, eases gastrointestinal discomfort, and fights minor infections.",
            "limonene": "Aromatic profile: Bright citrus and lemon. Medicinal uses: Elevates mood, relieves anxiety, and brings powerful antibacterial benefits.",
            "linalool": "Aromatic profile: Floral, lavender, and sweet. Medicinal uses: Delivers deep anti-anxiety and stress relief while encouraging restful sleep.",
            "nerolidol": "Aromatic profile: Woody, bark-like, and floral. Medicinal uses: Promotes restful sleep, acts as an antifungal agent, and assists with anti-parasitic care.",
            "ocimene": "Aromatic profile: Sweet, herbal, and tropical. Medicinal uses: Acts as an effective decongestant, fights viral infections, and provides an energizing lift.",
            "terpinene": "Aromatic profile: Citrus, woody, and herbal. Medicinal uses: Acts as a potent antioxidant, protects cellular health, and fights harmful microbes.",
            "terpinolene": "Aromatic profile: Complex citrus, floral, and herbal. Medicinal uses: Offers uplifting yet calming effects, strong antioxidant defense, and mild sedation."
        };

        function matchesVibeFilter(p, vibeVal) {
            if (vibeVal === "all") return true;
            const targetTerpenes = vibeMappings[vibeVal] || [];
            if (!Array.isArray(p.terpenes) || targetTerpenes.length === 0) return false;

            let highestVibeValue = 0;
            p.terpenes.forEach(t => {
                if (!t.name) return;
                const name = t.name.trim().toLowerCase();
                if (targetTerpenes.includes(name)) {
                    const val = t.value ?? t.percentage ?? t.amount ?? t.val;
                    const numVal = typeof val === "number" ? val : parseFloat(val) || 0;
                    if (numVal > highestVibeValue) {
                        highestVibeValue = numVal;
                    }
                }
            });

            return highestVibeValue >= 1.0;
        }

        async function init() {
            const statusDiv = document.getElementById("status");
            try {
                const productRequests = categories.map(cat => 
                    fetch(`https://cookiesflorida.co/wp-json/dovetail-api/v1/products?page=1&perpage=100&orderby=popular&order=desc&retailer=${retailer}&menutype=medical&categories[]=${cat}`)
                        .then(r => r.text())
                );

                const specialsRequest = fetch(`https://cookiesflorida.co/wp-json/dovetail-api/v1/specials?retailer=${retailer}&menutype=medical`)
                    .then(r => r.json())
                    .catch(() => null);

                const [responses, specialsData] = await Promise.all([
                    Promise.all(productRequests),
                    specialsRequest
                ]);

                if (specialsData) {
                    if (Array.isArray(specialsData)) {
                        loadedSpecials = specialsData;
                    } else if (specialsData.specials && Array.isArray(specialsData.specials)) {
                        loadedSpecials = specialsData.specials;
                    }
                }

                if (loadedSpecials.length === 0) {
                    loadedSpecials = [{
                        "id": "6a7cb3d55c4025000782a07f",
                        "name": "40% off storewide (Excluding Merch and Accessories)",
                        "type": "SALE"
                    }];
                }
                
                responses.forEach((raw, idx) => {
                    try {
                        const trimmed = raw.trim();
                        const fixedJson = JSON.parse(`${!trimmed.startsWith("[") ? "[" : ""}${trimmed}${!trimmed.endsWith("]") ? "]" : ""}`);
                        const parsedResults = fixedJson.flatMap(p => p.results ?? []);
                        parsedResults.forEach(p => {
                            if (!p._assignedCategory) p._assignedCategory = categories[idx];
                            
                            const hasDeal = p.sale || p.special || p.discount || (p.variants && p.variants.some(v => v.sale_price || v.discount)) || true;
                            if (hasDeal && loadedSpecials.length > 0) {
                                p._activeSpecial = loadedSpecials[0];
                            }
                        });
                        loadedProducts = loadedProducts.concat(parsedResults);
                    } catch (e) {
                        console.error("Parsing issue:", e);
                    }
                });

                if (loadedProducts.length === 0) {
                    statusDiv.textContent = "No products available for this location.";
                    return;
                }

                statusDiv.textContent = `Loaded ${loadedProducts.length} items for ${formattedRetailerName}`;
                populateDropdowns();
                applyFilters();

            } catch (err) {
                statusDiv.textContent = "Failed to load inventory data for this location.";
                console.error(err);
            }
        }

        function populateDropdowns() {
            const terpSet = new Set();
            const subcatSet = new Set();
            const strainSet = new Set();
            const variantSet = new Set();

            loadedProducts.forEach(p => {
                if (Array.isArray(p.terpenes)) {
                    p.terpenes.forEach(t => {
                        if (t.name) terpSet.add(t.name.trim());
                    });
                }
                
                const subcatVal = p.subcategory || p.sub_category || p.subCategory;
                if (subcatVal && typeof subcatVal === "string") {
                    subcatSet.add(subcatVal.trim());
                }

                const strainVal = p.strain_type || p.strainType || p.species;
                if (strainVal && typeof strainVal === "string") {
                    strainSet.add(strainVal.trim());
                }

                if (Array.isArray(p.variants)) {
                    p.variants.forEach(v => {
                        const vName = v.name || v.option || v.weight || v.size || v.title;
                        if (vName && typeof vName === "string") {
                            variantSet.add(vName.trim());
                        }
                    });
                }
            });

            const terpSelect = document.getElementById("terpeneFilter");
            Array.from(terpSet).sort().forEach(terpName => {
                const opt = document.createElement("option");
                opt.value = terpName;
                opt.textContent = terpName;
                terpSelect.appendChild(opt);
            });

            const subcatSelect = document.getElementById("subcatFilter");
            Array.from(subcatSet).sort().forEach(subName => {
                const opt = document.createElement("option");
                opt.value = subName;
                opt.textContent = subName;
                subcatSelect.appendChild(opt);
            });

            const strainSelect = document.getElementById("strainFilter");
            Array.from(strainSet).sort().forEach(strainName => {
                const opt = document.createElement("option");
                opt.value = strainName;
                opt.textContent = strainName;
                strainSelect.appendChild(opt);
            });

            const variantSelect = document.getElementById("variantFilter");
            Array.from(variantSet).sort().forEach(varName => {
                const opt = document.createElement("option");
                opt.value = varName;
                opt.textContent = varName;
                variantSelect.appendChild(opt);
            });
        }

        function onTerpeneChange() {
            const terpVal = document.getElementById("terpeneFilter").value;
            const descBox = document.getElementById("terpeneInfoDesc");
            if (terpVal === "all") {
                descBox.textContent = "Select a specific terpene to view its medicinal benefits and aromatic profile.";
            } else {
                const lower = terpVal.toLowerCase();
                descBox.textContent = terpeneDatabase[lower] || "Aromatic profile and medicinal data available soon.";
            }
            applyFilters();
        }

        function matchesSubcategory(p, subcatVal) {
            if (subcatVal === "all") return true;
            const val = p.subcategory || p.sub_category || p.subCategory;
            return val && val.trim() === subcatVal;
        }

        function matchesStrainType(p, strainVal) {
            if (strainVal === "all") return true;
            const val = p.strain_type || p.strainType || p.species;
            return val && val.trim() === strainVal;
        }

        function matchesVariantOption(p, variantVal) {
            if (variantVal === "all") return true;
            if (!Array.isArray(p.variants)) return false;
            return p.variants.some(v => {
                const vName = v.name || v.option || v.weight || v.size || v.title;
                return vName && vName.trim() === variantVal;
            });
        }

        function matchesSpecialFilter(p, specialVal) {
            if (specialVal === "all") return true;
            const hasSale = p.sale || p.special || p.discount || (p.variants && p.variants.some(v => v.sale_price || v.discount)) || p._activeSpecial;
            if (specialVal === "on-sale") return !!hasSale;
            if (specialVal === "none") return !hasSale;
            return true;
        }

        function getSpecificTerpeneVal(p, terpName) {
            if (!Array.isArray(p.terpenes)) return 0;
            let foundVal = 0;
            p.terpenes.forEach(t => {
                if (t.name && t.name.trim().toLowerCase() === terpName.trim().toLowerCase()) {
                    const val = t.value ?? t.percentage ?? t.amount ?? t.val;
                    foundVal = typeof val === "number" ? val : parseFloat(val) || 0;
                }
            });
            return foundVal;
        }

        function applyFilters() {
            const catVal = document.getElementById("categoryFilter").value;
            const subcatVal = document.getElementById("subcatFilter").value;
            const strainVal = document.getElementById("strainFilter").value;
            const variantVal = document.getElementById("variantFilter").value;
            const specialVal = document.getElementById("specialFilter").value;
            const vibeVal = document.getElementById("vibeFilter").value;
            const terpVal = document.getElementById("terpeneFilter").value;
            const sortMode = document.getElementById("sortModeFilter").value;

            let filtered = loadedProducts.filter(p => {
                if (catVal !== "all" && p._assignedCategory !== catVal) {
                    return false;
                }
                if (!matchesSubcategory(p, subcatVal)) {
                    return false;
                }
                if (!matchesStrainType(p, strainVal)) {
                    return false;
                }
                if (!matchesVariantOption(p, variantVal)) {
                    return false;
                }
                if (!matchesSpecialFilter(p, specialVal)) {
                    return false;
                }
                if (!matchesVibeFilter(p, vibeVal)) {
                    return false;
                }
                if (terpVal !== "all") {
                    const val = getSpecificTerpeneVal(p, terpVal);
                    if (val <= 0) return false;
                }
                return true;
            });

            // Sorting logic
            if (sortMode === "value-best") {
                filtered.sort((a, b) => {
                    let maxA = 0, maxB = 0;
                    if (Array.isArray(a.terpenes)) a.terpenes.forEach(t => { const v = parseFloat(t.value ?? t.percentage ?? 0) || 0; if (v > maxA) maxA = v; });
                    if (Array.isArray(b.terpenes)) b.terpenes.forEach(t => { const v = parseFloat(t.value ?? t.percentage ?? 0) || 0; if (v > maxB) maxB = v; });
                    
                    const priceA = parseFloat(a.price ?? a.regular_price ?? 0) || 0;
                    const priceB = parseFloat(b.price ?? b.regular_price ?? 0) || 0;

                    return maxB - maxA || priceA - priceB;
                });
            } else if (sortMode === "targeted-best" && terpVal !== "all") {
                filtered.sort((a, b) => {
                    const valA = getSpecificTerpeneVal(a, terpVal);
                    const valB = getSpecificTerpeneVal(b, terpVal);
                    const priceA = parseFloat(a.price ?? a.regular_price ?? 0) || 0;
                    const priceB = parseFloat(b.price ?? b.regular_price ?? 0) || 0;

                    return valB - valA || priceA - priceB;
                });
            }

            renderProducts(filtered);
        }

        function resetAllFilters() {
            document.getElementById("categoryFilter").value = "all";
            document.getElementById("subcatFilter").value = "all";
            document.getElementById("strainFilter").value = "all";
            document.getElementById("variantFilter").value = "all";
            document.getElementById("specialFilter").value = "all";
            document.getElementById("sortModeFilter").value = "default";
            document.getElementById("vibeFilter").value = "all";
            document.getElementById("terpeneFilter").value = "all";
            document.getElementById("terpeneInfoDesc").textContent = "Select a specific terpene to view its medicinal benefits and aromatic profile.";
            applyFilters();
        }

        function renderProducts(products) {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";

            if (products.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px;">No products match your current filter selection.</div>`;
                return;
            }

            products.forEach(p => {
                const card = document.createElement("div");
                card.className = "product-card";

                const imgSrc = p.image || p.image_url || (p.images && p.images[0]) || "https://via.placeholder.com/150?text=No+Image";
                const title = p.name || p.title || "Unnamed Product";
                const desc = p.description || p.short_description || "No description available.";
                
                let price = p.price ?? p.regular_price ?? p.variants?.[0]?.price ?? 0;
                if (typeof price === "number") price = `$${price.toFixed(2)}`;

                let topTerpName = "Terpenes";
                let topTerpVal = "";
                if (Array.isArray(p.terpenes) && p.terpenes.length > 0) {
                    let highest = p.terpenes[0];
                    p.terpenes.forEach(t => {
                        const curVal = parseFloat(t.value ?? t.percentage ?? 0) || 0;
                        const highVal = parseFloat(highest.value ?? highest.percentage ?? 0) || 0;
                        if (curVal > highVal) highest = t;
                    });
                    if (highest && highest.name) {
                        topTerpName = highest.name;
                        const rawV = highest.value ?? highest.percentage ?? "";
                        topTerpVal = rawV ? (typeof rawV === "number" ? `${rawV}%` : rawV) : "";
                    }
                }

                const cardId = p.id || title;
                const activeColor = userSelections[cardId];
                const circleClass = activeColor ? `select-circle ${activeColor}` : "select-circle";
                const circleText = activeColor ? (allColors.indexOf(activeColor) + 1) : "";

                card.innerHTML = `
                    <div class="card-selection-badge">
                        <button class="${circleClass}" onclick="cycleSelection(event, '${cardId}')">${circleText}</button>
                    </div>
                    <div class="card-top" onmouseenter="showHoverPreview(event, '${imgSrc}')" onmouseleave="hideHoverPreview()">
                        <img src="${imgSrc}" alt="${title}">
                        <div class="card-info">
                            <div class="card-title" title="${title}">${title}</div>
                            <div class="card-desc">${desc}</div>
                        </div>
                    </div>
                    <div class="card-footer-row">
                        <div class="card-price-area">
                            <div class="card-price">${price}</div>
                            ${p._activeSpecial ? `<div class="card-sale-badge">${p._activeSpecial.type || 'SALE'}</div>` : ''}
                        </div>
                        <div class="card-terp-badge">
                            <span>${topTerpVal}</span>
                            <span class="card-terp-label-name">${topTerpName}</span>
                        </div>
                    </div>
                `;

                card.onclick = (e) => {
                    if (e.target.tagName === 'BUTTON') return;
                    openModal(p);
                };

                grid.appendChild(card);
            });
        }

        function cycleSelection(event, cardId) {
            event.stopPropagation();
            const currentColor = userSelections[cardId];
            if (!currentColor) {
                userSelections[cardId] = allColors[0];
            } else {
                const nextIdx = allColors.indexOf(currentColor) + 1;
                if (nextIdx < allColors.length) {
                    userSelections[cardId] = allColors[nextIdx];
                } else {
                    delete userSelections[cardId];
                }
            }
            applyFilters();
        }

        function showHoverPreview(event, imgSrc) {
            const tooltip = document.getElementById("hoverPreview");
            const img = document.getElementById("hoverPreviewImg");
            img.src = imgSrc;
            tooltip.style.display = "flex";
            tooltip.style.left = `${event.clientX + 20}px`;
            tooltip.style.top = `${event.clientY - 120}px`;
        }

        function hideHoverPreview() {
            document.getElementById("hoverPreview").style.display = "none";
        }

        function openModal(p) {
            const overlay = document.getElementById("modalOverlay");
            const body = document.getElementById("modalBody");
            const imgSrc = p.image || p.image_url || (p.images && p.images[0]) || "https://via.placeholder.com/150?text=No+Image";
            const title = p.name || p.title || "Unnamed Product";
            const sub = p.subcategory || p.strain_type || p._assignedCategory || "";
            
            let terpRowsHtml = "";
            if (Array.isArray(p.terpenes) && p.terpenes.length > 0) {
                terpRowsHtml = p.terpenes.map((t, idx) => {
                    const name = t.name || "Unknown";
                    const val = t.value ?? t.percentage ?? t.amount ?? t.val ?? "0";
                    const formattedVal = typeof val === "number" ? `${val}%` : val;
                    return `
                        <div class="terp-row">
                            <div class="terp-name-area">
                                <div class="terp-badge-icon">${idx + 1}</div>
                                <span style="text-transform: capitalize;">${name}</span>
                            </div>
                            <div class="terp-metric-area">
                                <span class="terp-pct">${formattedVal}</span>
                            </div>
                        </div>
                    `;
                }).join("");
            } else {
                terpRowsHtml = `<div style="text-align: center; color: var(--muted); padding: 12px;">No terpene profile breakdown listed.</div>`;
            }

            body.innerHTML = `
                <div class="modal-header-info">
                    <div class="modal-title">${title}</div>
                    ${sub ? `<div class="modal-sub" style="text-transform: capitalize;">${sub}</div>` : ''}
                </div>
                ${p._activeSpecial ? `<div class="modal-special-banner">🔥 ${p._activeSpecial.name}</div>` : ''}
                <div class="image-container">
                    <div class="large-image-wrapper">
                        <img src="${imgSrc}" alt="${title}">
                    </div>
                </div>
                <div style="font-size: 0.85rem; font-weight: 700; color: var(--muted); margin-bottom: -4px;">Terpene Profile Analysis</div>
                <div class="terpene-list-box">
                    ${terpRowsHtml}
                </div>
                <div class="shop-row">
                    <a href="https://cookiesflorida.co" target="_blank" class="shop-btn">View on Store Menu</a>
                </div>
            `;
            overlay.classList.add("active");
        }

        function closeModal() {
            document.getElementById("modalOverlay").classList.remove("active");
        }

        function handleModalClick(event) {
            if (event.target.id === "modalOverlay") {
                closeModal();
            }
        }

        init();
    </script>
</body>
</html>
